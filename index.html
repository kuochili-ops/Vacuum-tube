<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>𓃥 白六真空管訊息傳遞</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030305;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      touch-action: none;
    }

    /* 頂部固定控制介面 */
    .ui-overlay-fixed {
      position: fixed !important;
      top: 15px !important;
      left: 15px !important;
      right: 15px !important;
      z-index: 99999 !important;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .panel {
      background: rgba(16, 12, 10, 0.94);
      border: 1px solid rgba(255, 120, 0, 0.45);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85), 0 0 20px rgba(255, 100, 0, 0.2);
      backdrop-filter: blur(14px);
      padding: 14px 18px;
      border-radius: 12px;
      pointer-events: auto;
      width: 100%;
      max-width: 360px;
      transition: all 0.3s ease;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 15px;
      font-weight: 700;
      color: #ff9933;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 120, 0, 0.5);
    }

    .collapse-btn {
      background: rgba(40, 25, 15, 0.9);
      border: 1px solid rgba(255, 120, 0, 0.4);
      color: #ffcc99;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .panel-body {
      transition: max-height 0.3s ease, opacity 0.3s ease;
      overflow: hidden;
    }

    .panel.collapsed .panel-body {
      max-height: 0;
      opacity: 0;
      margin-top: 0;
    }

    p {
      font-size: 11px;
      color: #b3a090;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group {
      display: flex;
      gap: 6px;
    }

    input[type="text"] {
      background: rgba(10, 8, 6, 0.9);
      border: 1px solid #663300;
      color: #ffaa44;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 15px;
      width: 100%;
      outline: none;
      text-align: center;
      letter-spacing: 1px;
      font-weight: bold;
    }

    button {
      background: linear-gradient(135deg, #d95e00, #802d00);
      border: 1px solid #ff7700;
      color: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      white-space: nowrap;
      font-size: 12px;
    }

    button:hover {
      background: linear-gradient(135deg, #f26d00, #a63a00);
      box-shadow: 0 0 12px rgba(242, 109, 0, 0.6);
    }

    .action-row {
      display: flex;
      gap: 6px;
    }

    .action-row button {
      flex: 1;
    }

    .recording-badge {
      display: none;
      background: rgba(255, 0, 0, 0.85);
      color: #fff;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      animation: pulse 1.5s infinite;
      font-weight: bold;
      margin-top: 6px;
      text-align: center;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .tip-fixed {
      position: fixed !important;
      bottom: 15px !important;
      left: 15px !important;
      z-index: 99999 !important;
      font-size: 11px;
      color: #8c7664;
      pointer-events: none;
      background: rgba(12, 10, 8, 0.85);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 120, 0, 0.2);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- 固定於螢幕頂端的控制介面 -->
  <div class="ui-overlay-fixed">
    <div class="panel" id="controlPanel">
      <div class="panel-header">
        <h1>𓃥 白六真空管訊息傳遞</h1>
        <button class="collapse-btn" onclick="toggleCollapse()" id="collapseBtn">收合</button>
      </div>
      <div class="panel-body">
        <p>6管序列漸變傳遞。支援自動錄影與設定複製。</p>
        <div class="controls">
          <div class="input-group">
            <input type="text" id="textInput" value="系統自動優化完成" maxlength="20">
            <button onclick="updateText()">高壓點亮</button>
          </div>
          <div class="action-row">
            <button onclick="startAutoRecord()" id="recordBtn">🎬 自動錄影</button>
            <button onclick="copyShareData()">📋 複製設定與連結</button>
          </div>
          <div id="recordingBadge" class="recording-badge">🔴 正在自動錄影中...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tip-fixed">💡 觸控 / 滑鼠：拖曳旋轉 3D 視角 | 雙指/滾輪縮放</div>

  <script>
    let scene, camera, renderer, controls;
    let clockRackGroup = new THREE.Group();
    
    let currentMessage = "系統自動優化完成";
    let baseOffsetIndex = 0;
    let scrollTimer = null;

    let tubeStates = []; 
    let isCollapsed = false;

    // 錄影相關變數
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 22);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 50;
      controls.minDistance = 8;
      controls.target.set(0, 0, 0);

      const ambientLight = new THREE.AmbientLight(0xffeedd, 1.2);
      scene.add(ambientLight);

      const topLight = new THREE.DirectionalLight(0xffeedd, 2.0);
      topLight.position.set(10, 20, 15);
      scene.add(topLight);

      const neonPointLight = new THREE.PointLight(0xff5500, 4.0, 45);
      neonPointLight.position.set(0, 2, 8);
      scene.add(neonPointLight);

      scene.add(clockRackGroup);
      
      initRack(currentMessage);
      startSequentialScrolling();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function toggleCollapse() {
      isCollapsed = !isCollapsed;
      const panel = document.getElementById('controlPanel');
      const btn = document.getElementById('collapseBtn');
      if (isCollapsed) {
        panel.classList.add('collapsed');
        btn.innerText = '展開';
      } else {
        panel.classList.remove('collapsed');
        btn.innerText = '收合';
      }
    }

    // 產生細體金屬線條紋理
    function createNixieCharTextures(char, isLit = true) {
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = 512;
      colorCanvas.height = 512;
      const cCtx = colorCanvas.getContext('2d');
      cCtx.clearRect(0, 0, 512, 512);

      const dispCanvas = document.createElement('canvas');
      dispCanvas.width = 512;
      dispCanvas.height = 512;
      const dCtx = dispCanvas.getContext('2d');
      dCtx.fillStyle = '#000000';
      dCtx.fillRect(0, 0, 512, 512);

      if (char && char.trim() !== '') {
        cCtx.lineJoin = 'round';
        cCtx.lineCap = 'round';
        cCtx.font = '500 220px "STKaiti", "KaiTi", "標楷體", "PingFang TC", "Microsoft JhengHei", sans-serif';
        cCtx.textAlign = 'center';
        cCtx.textBaseline = 'middle';

        dCtx.lineJoin = 'round';
        dCtx.lineCap = 'round';
        dCtx.font = '500 220px "STKaiti", "KaiTi", "標楷體", "PingFang TC", "Microsoft JhengHei", sans-serif';
        dCtx.textAlign = 'center';
        dCtx.textBaseline = 'middle';

        if (isLit) {
          cCtx.strokeStyle = 'rgba(255, 30, 0, 0.9)';
          cCtx.lineWidth = 28;
          cCtx.strokeText(char, 256, 256);

          cCtx.strokeStyle = '#ff4500';
          cCtx.lineWidth = 16;
          cCtx.strokeText(char, 256, 256);

          cCtx.strokeStyle = '#ffffff';
          cCtx.lineWidth = 8;
          cCtx.strokeText(char, 256, 256);
        } else {
          cCtx.strokeStyle = 'rgba(160, 150, 140, 0.65)';
          cCtx.lineWidth = 10;
          cCtx.strokeText(char, 256, 256);
        }

        dCtx.strokeStyle = '#ffffff';
        dCtx.lineWidth = 12;
        dCtx.strokeText(char, 256, 256);
      }

      const colorTex = new THREE.CanvasTexture(colorCanvas);
      colorTex.needsUpdate = true;

      const dispTex = new THREE.CanvasTexture(dispCanvas);
      dispTex.needsUpdate = true;

      return { colorTex, dispTex };
    }

    // 蜂巢金屬陽極網格貼圖
    function createHoneycombTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, 128, 128);
      ctx.strokeStyle = '#d0b8a0';
      ctx.lineWidth = 3;

      const size = 16;
      for (let x = 0; x <= 128; x += size) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 128);
        ctx.stroke();
      }
      for (let y = 0; y <= 128; y += size) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(128, y);
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(5, 7);
      return texture;
    }

    // 創建單個輝光管
    function createSingleIN18Tube(char, tubeIndex) {
      const tubeGroup = new THREE.Group();

      const radius = 1.3;
      const height = 4.8;

      const baseGeo = new THREE.CylinderGeometry(radius + 0.25, radius + 0.25, 0.7, 32);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x221812, roughness: 0.7, metalness: 0.2 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.y = -height / 2 - 0.35;
      tubeGroup.add(baseMesh);

      const litTexs = createNixieCharTextures(char, true);
      const charGeo = new THREE.PlaneGeometry(radius * 2.2, radius * 2.2, 128, 128);
      const litMat = new THREE.MeshStandardMaterial({
        map: litTexs.colorTex,
        displacementMap: litTexs.dispTex,
        displacementScale: 0.2,
        transparent: true,
        opacity: 1.0,
        side: THREE.DoubleSide,
        depthWrite: false,
        roughness: 0.2,
        metalness: 0.9,
        emissive: 0xff3300,
        emissiveMap: litTexs.colorTex,
        emissiveIntensity: 1.5
      });

      tubeStates[tubeIndex] = {
        material: litMat,
        currentText: char,
        targetText: char,
        phase: 'idle',
        progress: 1.0
      };

      const litMesh = new THREE.Mesh(charGeo, litMat);
      litMesh.position.z = 0.15;
      tubeGroup.add(litMesh);

      const unlitChars = ['統', '系'];
      unlitChars.forEach((unlitChar, idx) => {
        const unlitTexs = createNixieCharTextures(unlitChar, false);
        const unlitMat = new THREE.MeshStandardMaterial({
          map: unlitTexs.colorTex,
          displacementMap: unlitTexs.dispTex,
          displacementScale: 0.1,
          transparent: true,
          side: THREE.DoubleSide,
          depthWrite: false,
          roughness: 0.4,
          metalness: 0.8
        });
        const unlitMesh = new THREE.Mesh(charGeo, unlitMat);
        unlitMesh.position.z = -0.15 - idx * 0.25;
        tubeGroup.add(unlitMesh);
      });

      const meshGeo = new THREE.CylinderGeometry(radius - 0.15, radius - 0.15, height - 1.0, 32, 1, true);
      const meshMat = new THREE.MeshBasicMaterial({
        map: createHoneycombTexture(),
        transparent: true,
        opacity: 0.35,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const meshCylinder = new THREE.Mesh(meshGeo, meshMat);
      meshCylinder.position.y = -0.15;
      tubeGroup.add(meshCylinder);

      const glassMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.12,
        depthWrite: false
      });

      const glassBodyGeo = new THREE.CylinderGeometry(radius, radius, height, 32);
      const glassMesh = new THREE.Mesh(glassBodyGeo, glassMat);
      tubeGroup.add(glassMesh);

      const topDomeGeo = new THREE.SphereGeometry(radius, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
      const topDome = new THREE.Mesh(topDomeGeo, glassMat);
      topDome.position.y = height / 2;
      tubeGroup.add(topDome);

      const tipGeo = new THREE.CylinderGeometry(0.12, 0.22, 0.4, 16);
      const tip = new THREE.Mesh(tipGeo, glassMat);
      tip.position.y = height / 2 + radius + 0.15;
      tubeGroup.add(tip);

      const micaMat = new THREE.MeshPhysicalMaterial({ 
        color: 0xffaa33, 
        transparent: true, 
        opacity: 0.85, 
        roughness: 0.2, 
        metalness: 0.1, 
        transmission: 0.6,
        side: THREE.DoubleSide
      });
      const topMicaGeo = new THREE.SphereGeometry(radius - 0.1, 32, 8, 0, Math.PI * 2, 0, Math.PI / 3);
      const topMica = new THREE.Mesh(topMicaGeo, micaMat);
      topMica.position.y = height / 2 - 0.35;
      topMica.scale.set(1, 0.25, 1);
      tubeGroup.add(topMica);

      const bottomMicaGeo = new THREE.CylinderGeometry(radius - 0.1, radius - 0.1, 0.08, 32);
      const bottomMicaMat = new THREE.MeshStandardMaterial({ color: 0xd4b584, roughness: 0.5 });
      const bottomMica = new THREE.Mesh(bottomMicaGeo, bottomMicaMat);
      bottomMica.position.y = -height / 2 + 0.4;
      tubeGroup.add(bottomMica);

      const wireMat = new THREE.LineBasicMaterial({ color: 0xdda885, transparent: true, opacity: 0.6 });
      const wireCount = 12;
      for (let w = 0; w < wireCount; w++) {
        const curve = new THREE.CubicBezierCurve3(
          new THREE.Vector3((Math.random() - 0.5) * (radius * 1.4), height / 2 - 0.5, (Math.random() - 0.5) * 1.0),
          new THREE.Vector3((Math.random() - 0.5) * radius * 1.6, (Math.random() - 0.5) * height, (Math.random() - 0.5) * 1.2),
          new THREE.Vector3((Math.random() - 0.5) * radius * 1.6, (Math.random() - 0.5) * height, (Math.random() - 0.5) * 1.2),
          new THREE.Vector3((Math.random() - 0.5) * (radius * 1.4), -height / 2 + 0.5, -radius + 0.3)
        );
        const pts = curve.getPoints(10);
        const wireGeo = new THREE.BufferGeometry().setFromPoints(pts);
        tubeGroup.add(new THREE.Line(wireGeo, wireMat));
      }

      return tubeGroup;
    }

    function initRack(text) {
      while(clockRackGroup.children.length > 0){ 
        clockRackGroup.remove(clockRackGroup.children[0]); 
      }
      tubeStates = [];

      const chars = text.padEnd(6, ' ').slice(0, 6).split('');
      const spacing = 2.6; 
      const totalWidth = 17.5; 
      const rackDepth = 4.8;
      const rackHeight = 0.8;

      const rackGeo = new THREE.BoxGeometry(totalWidth, rackHeight, rackDepth);
      const rackMat = new THREE.MeshStandardMaterial({
        color: 0x2e1d14,
        roughness: 0.5,
        metalness: 0.2
      });
      const rackBase = new THREE.Mesh(rackGeo, rackMat);
      rackBase.position.y = -2.8;
      clockRackGroup.add(rackBase);

      const startX = -((chars.length - 1) * spacing) / 2;

      chars.forEach((char, index) => {
        let posX = startX + index * spacing;
        const tube = createSingleIN18Tube(char, index);
        tube.position.set(posX, 0, 0);
        clockRackGroup.add(tube);
      });

      clockRackGroup.position.set(0, 0, 0);
      clockRackGroup.rotation.y = -0.2;
      clockRackGroup.rotation.x = 0.12;
    }

    function startSequentialScrolling() {
      if (scrollTimer) clearInterval(scrollTimer);

      if (currentMessage.length > 6) {
        scrollTimer = setInterval(() => {
          baseOffsetIndex = (baseOffsetIndex + 1) % currentMessage.length;
          
          for (let i = 0; i < 6; i++) {
            setTimeout(() => {
              let charIndex = (baseOffsetIndex + i) % currentMessage.length;
              let newChar = currentMessage[charIndex];
              
              if (tubeStates[i]) {
                tubeStates[i].targetText = newChar;
                tubeStates[i].phase = 'fadingOut'; 
              }
            }, i * 140);
          }
        }, 3000);
      }
    }

    function updateText() {
      const val = document.getElementById('textInput').value || "系統自動優化完成";
      currentMessage = val;
      baseOffsetIndex = 0;
      initRack(currentMessage);
      startSequentialScrolling();
    }

    // 自動錄影功能：錄製一輪循環後，最後一個字出現後 3 秒自動停止並存檔
    function startAutoRecord() {
      if (isRecording) return;

      const stream = renderer.domElement.captureStream(30);
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp9' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = function(event) {
        if (event.data && event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };

      mediaRecorder.onstop = function() {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `𓃥白六真空管訊息_${Date.now()}.webm`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        
        document.getElementById('recordingBadge').style.display = 'none';
        document.getElementById('recordBtn').disabled = false;
        isRecording = false;
      };

      mediaRecorder.start();
      isRecording = true;
      document.getElementById('recordingBadge').style.display = 'block';
      document.getElementById('recordBtn').disabled = true;

      // 計算一輪播放所需時間：若字數 > 6，則完整跑完一輪需要 (字數 * 3秒)，再加上最後出現後 3 秒
      const loops = Math.max(currentMessage.length, 6);
      const totalRecordTimeMs = (loops * 3000) + 3000;

      setTimeout(() => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
      }, totalRecordTimeMs);
    }

    // 複製 App URL、訊息與設定
    function copyShareData() {
      const msg = document.getElementById('textInput').value;
      const shareText = `【𓃥 白六真空管訊息傳遞】\n網址: ${window.location.href}\n目前訊息設定: ${msg}`;
      
      navigator.clipboard.writeText(shareText).then(() => {
        alert('✅ 已成功將設定與連結複製到剪貼簿！');
      }).catch(err => {
        alert('❌ 複製失敗，請手動複製。');
      });
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);

      tubeStates.forEach((state, i) => {
        if (!state) return;

        if (state.phase === 'fadingOut') {
          state.progress -= 0.08;
          if (state.progress <= 0.0) {
            state.progress = 0.0;
            state.currentText = state.targetText;
            
            const newTexs = createNixieCharTextures(state.currentText, true);
            state.material.map = newTexs.colorTex;
            state.material.displacementMap = newTexs.dispTex;
            state.material.emissiveMap = newTexs.colorTex;
            state.material.map.needsUpdate = true;
            state.material.displacementMap.needsUpdate = true;
            state.material.emissiveMap.needsUpdate = true;

            state.phase = 'fadingIn'; 
          }
        } else if (state.phase === 'fadingIn') {
          state.progress += 0.08;
          if (state.progress >= 1.0) {
            state.progress = 1.0;
            state.phase = 'idle';
          }
        }

        state.material.opacity = state.progress;
        state.material.emissiveIntensity = 1.5 * state.progress;
      });

      if (controls) controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
